services:
  blog:
    # 不走镜像仓库：本地构建镜像传服务器（deploy-local.sh），或服务器上 deploy.sh 构建
    build: .
    container_name: myblog-backend
    restart: unless-stopped
    ports:
      - "8812:8812"
    networks:
      - blog-net    # 与前端同一网络，nginx 用容器名直连，不绕宿主机网关
    volumes:
      # SQLite 数据文件（容器里 ../data -> /app/data）
      - blog-data:/app/data
      # 日志（容器里 ../logs -> /app/logs）
      - blog-logs:/app/logs
      # 填好真实 OSS / JWT 密钥的配置文件，在服务器上创建，不要提交进 git
      - ./blog-api.prod.yaml:/app/blog/etc/blog-api.yaml:ro

volumes:
  blog-data:
  blog-logs:

networks:
  blog-net:
    external: true  # 首次部署先 docker network create blog-net，前后端共用
