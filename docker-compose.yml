services:
  blog:
    # 改成你自己的镜像地址（和 build.yml 里 IMAGE 对应）
    # 例如 Docker Hub: yourname/myblog-backend:main  阿里云 ACR: registry.cn-hangzhou.aliyuncs.com/yourns/myblog-backend:main
    image: ghcr.io/your-owner/myblog_backend:main
    container_name: myblog-backend
    restart: unless-stopped
    ports:
      - "8812:8812"
    volumes:
      # SQLite 数据文件（容器里 ../data -> /app/data）
      - blog-data:/app/data
      # 日志（容器里 ../logs -> /app/logs）
      - blog-logs:/app/logs
      # 填好真实 OSS / JWT 密钥的配置文件，在服务器上创建，不要提交进 git
      - ./blog-api.prod.yaml:/app/blog/etc/blog-api.yaml:ro

volumes:
  blog-data:
  blog-logs:
